name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/asmrandle-ci.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      ASMRANDLE_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, xml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --working-dir=backend --no-interaction --prefer-dist
      - run: php backend/vendor/bin/phpunit --configuration backend/phpunit.xml
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start test application
        run: |
          touch "$DB_DATABASE"
          php backend/artisan migrate --force
          php backend/artisan db:seed --class=BrowserTestSeeder --force
          php backend/artisan serve --host=127.0.0.1 --port=3000 > /tmp/asmrandle-ci.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/config; then exit 0; fi
            sleep 1
          done
          cat /tmp/asmrandle-ci.log
          exit 1
      - run: npx playwright test --workers=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        run: if [ -n "${SERVER_PID:-}" ]; then kill "$SERVER_PID" || true; fi
