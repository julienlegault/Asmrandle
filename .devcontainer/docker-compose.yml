services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/Asmrandle:cached
    working_dir: /workspaces/Asmrandle
    # Bootstraps (dependencies, .env, migrations, fake data) and serves Laravel on 8000.
    command: bash .devcontainer/start.sh
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: asmrandle
      MYSQL_USER: asmrandle
      MYSQL_PASSWORD: asmrandle
      MYSQL_ROOT_PASSWORD: local-dev-only
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
