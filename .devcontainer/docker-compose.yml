services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/Asmrandle:cached
    working_dir: /workspaces/Asmrandle
    ports:
      - "8000:8000"
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: asmrandle
      MYSQL_USER: asmrandle
      MYSQL_PASSWORD: asmrandle
      MYSQL_ROOT_PASSWORD: local-dev-only
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/Asmrandle:cached
    working_dir: /workspaces/Asmrandle/backend
    command: sh -c 'until [ -f vendor/autoload.php ] && [ -f .env ]; do sleep 2; done; exec php artisan schedule:work'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
